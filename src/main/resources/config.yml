# BrassField 설정. 바꾼 뒤 서버를 재시작하면 적용됩니다.

# 강화석 상점: 강화석 1개 가격(골드)
# 하루 6시간 기준 25강까지 약 2개월이 되도록 정한 값 (노션 경제 설계 > 등급별 강화석 가격)
stone-shop:
  prices:
    LOW: 1000
    MIDDLE: 1000
    HIGH: 16000

# 종자·작물 거래기: 작물 1개 매입가와 씨앗 1개 판매가(골드). 노션 경제 설계 > 작물 판매 (2026-11-15)
# 작물은 소소한 기본 수입이고 큰돈은 요리에서 나온다. 원자재 20골드 기준, 오래 자라는 작물일수록 비싸다.
#   성장 3~4단계 20 / 5~6단계 30 / 8단계 40
crop-shop:
  # 품질 배율: 일반 x1, 은별 x2, 금별 x4, 거대·황금 작물 x10
  quality-multipliers:
    silver: 2
    golden: 4
    special: 10
  # 작물 ID → 이름, 일반 품질 매입가, 씨앗(<ID>_seeds) 판매가. 네임스페이스가 없으면 customcrops:<ID>
  # 은별은 <ID>_silver_star, 금별은 <ID>_golden_star. 씨앗값은 일반 매입가의 절반 (수확하면 씨앗도 다시 나와 사실상 시작 비용)
  crops:
    tomato: { name: 토마토, price: 30, seed-price: 15 }
    cabbage: { name: 양배추, price: 20, seed-price: 10 }
    chinese_cabbage: { name: 배추, price: 20, seed-price: 10 }
    corn: { name: 옥수수, price: 20, seed-price: 10 }
    eggplant: { name: 가지, price: 20, seed-price: 10 }
    garlic: { name: 마늘, price: 20, seed-price: 10 }
    grape: { name: 포도, price: 40, seed-price: 20 }
    hop: { name: 홉, price: 20, seed-price: 10 }
    pepper: { name: 고추, price: 30, seed-price: 15 }
    pineapple: { name: 파인애플, price: 20, seed-price: 10 }
    pitaya: { name: 용과, price: 40, seed-price: 20 }
    # BrassField 자체 작물 (tools/crops/make_crops.py) — 네임스페이스까지 적는다
    "rustport:rice": { name: 쌀, price: 20, seed-price: 10 }
    "rustport:onion": { name: 양파, price: 20, seed-price: 10 }
  # 드물게 나오는 수확물 → 어느 작물 가격에 special 배율을 곱할지
  special-items:
    "customcrops:gigantic_tomato": tomato
    "customcrops:golden_tomato": tomato
    "customcrops:gigantic_cabbage": cabbage
    "customcrops:gigantic_pineapple": pineapple

# 요리 기기 레시피. 노션 경제 설계 > 요리 (2026-11-15)
# 단계: 0단계(작물·바닐라 재료) → 보조 도구(제분기·착즙기·발효조·훈연기·대형 솥·제빵 오븐)·절구 → 1단계
#       → 조리대(1단계 + 0단계) → 2단계 요리
# 재료 칸에 든 재료 종류가 레시피와 정확히 같아야 그 결과가 된다 (위치 상관없음). 작물 품질(은별·금별)은 구분하지 않는다.
# 재료가 여러 세트 들어 있으면 한 세트씩 이어서 만든다. amount: 한 번에 나오는 개수 (기본 1).
# 우유 양동이·꿀병·물병을 쓰면 빈 양동이·빈 병은 부산물 칸으로 돌려준다.
cooking:
  # "#묶음" 재료: 이 중 아무거나
  groups:
    flour: { name: 밀가루나 옥수수가루, items: ["rustport:flour", "rustport:cornmeal"] }     # 옥수수가루는 밀가루 대신 쓸 수 있다
    raw_meat: { name: 생고기, items: ["minecraft:beef", "minecraft:porkchop", "minecraft:chicken", "minecraft:mutton"] }
    mushroom: { name: 버섯, items: ["minecraft:brown_mushroom", "minecraft:red_mushroom"] }
  # 기기 → ItemsAdder 가구 ID, 창 제목, 레시피 (결과 ID(rustport:<ID>) → 조리 시간(초)·개수·재료)
  stations:
    mill:
      furniture: "rustport:mill"
      title: 제분기
      recipes:
        flour: { seconds: 5, ingredients: { "minecraft:wheat": 1 } }
        cornmeal: { seconds: 5, ingredients: { "customcrops:corn": 1 } }
        patty: { seconds: 5, ingredients: { "minecraft:beef": 1 } }
    juicer:
      furniture: "rustport:juicer"
      title: 착즙기
      recipes:
        apple_juice: { seconds: 8, ingredients: { "minecraft:apple": 2 } }
        grape_juice: { seconds: 8, ingredients: { "customcrops:grape": 2 } }
        pineapple_juice: { seconds: 8, ingredients: { "customcrops:pineapple": 1 } }
        pitaya_juice: { seconds: 8, ingredients: { "customcrops:pitaya": 1 } }
        tomato_sauce: { seconds: 5, ingredients: { "customcrops:tomato": 2 } }
    fermenter:
      furniture: "rustport:fermenter"
      title: 발효조
      recipes:
        cheese: { seconds: 20, ingredients: { "minecraft:milk_bucket": 1 } }
        yogurt: { seconds: 20, ingredients: { "minecraft:milk_bucket": 1, "minecraft:honey_bottle": 1 } }
        kimchi: { seconds: 20, ingredients: { "customcrops:chinese_cabbage": 1, "customcrops:pepper": 1, "customcrops:garlic": 1 } }
    smoker:
      furniture: "rustport:smoker"
      title: 훈연기
      recipes:
        smoked_beef: { seconds: 15, ingredients: { "minecraft:beef": 1 } }
        bacon: { seconds: 15, ingredients: { "minecraft:porkchop": 1 } }
        smoked_salmon: { seconds: 15, ingredients: { "minecraft:salmon": 1 } }
    kettle:
      furniture: "rustport:kettle"
      title: 대형 솥
      recipes:
        cooked_rice: { seconds: 5, ingredients: { "rustport:rice": 1 } }
        noodles: { seconds: 5, ingredients: { "rustport:dough": 1 } }
        chicken_soup: { seconds: 20, amount: 4, ingredients: { "minecraft:chicken": 1, "minecraft:carrot": 1, "rustport:onion": 1, "customcrops:garlic": 1 } }
        vegetable_soup: { seconds: 20, amount: 4, ingredients: { "minecraft:carrot": 1, "minecraft:potato": 1, "rustport:onion": 1, "customcrops:tomato": 1, "customcrops:cabbage": 1 } }
        beef_stew: { seconds: 20, amount: 4, ingredients: { "minecraft:beef": 1, "minecraft:potato": 1, "minecraft:carrot": 1, "rustport:onion": 1 } }
        corn_soup: { seconds: 20, amount: 4, ingredients: { "rustport:cornmeal": 1, "minecraft:milk_bucket": 1, "rustport:onion": 1 } }
    oven:
      furniture: "rustport:oven"
      title: 제빵 오븐
      recipes:
        bread_loaf: { seconds: 10, ingredients: { "rustport:dough": 1 } }
        pie_crust: { seconds: 10, ingredients: { "rustport:dough": 1, "minecraft:egg": 1 } }
        honey_cookie: { seconds: 10, ingredients: { "#flour": 1, "minecraft:honey_bottle": 1 } }
    # 조리대: 1단계 + 0단계 → 2단계. 조리 시간: 간단 10초 / 중급 20초 / 복잡 40초
    counter:
      furniture: "rustport:steam_cooker"
      title: 조리대
      recipes:
        salmon_sushi: { seconds: 10, ingredients: { "minecraft:salmon": 1, "rustport:cooked_rice": 1 } }
        cabbage_wrap: { seconds: 10, ingredients: { "customcrops:cabbage": 1, "rustport:smoked_beef": 1 } }
        kimbap: { seconds: 10, ingredients: { "minecraft:dried_kelp": 1, "minecraft:carrot": 1, "rustport:cooked_rice": 1 } }
        mushroom_fried_rice: { seconds: 10, ingredients: { "#mushroom": 1, "rustport:cooked_rice": 1, "minecraft:potato": 1 } }
        bacon_and_eggs: { seconds: 10, ingredients: { "rustport:bacon": 1, "minecraft:egg": 1 } }
        kimchi_fried_rice: { seconds: 20, ingredients: { "rustport:kimchi": 1, "rustport:cooked_rice": 1 } }
        meatball_pasta: { seconds: 20, ingredients: { "rustport:noodles": 1, "rustport:patty": 1, "rustport:tomato_sauce": 1 } }
        ratatouille: { seconds: 20, ingredients: { "minecraft:pumpkin": 1, "rustport:tomato_sauce": 1, "rustport:onion": 1, "customcrops:eggplant": 1 } }
        fried_rice: { seconds: 20, ingredients: { "rustport:cooked_rice": 1, "minecraft:egg": 1, "minecraft:carrot": 1, "rustport:onion": 1 } }
        dumplings: { seconds: 20, ingredients: { "rustport:dough": 1, "customcrops:cabbage": 1, "rustport:onion": 1, "#raw_meat": 1 } }
        apple_pie: { seconds: 20, ingredients: { "rustport:pie_crust": 1, "minecraft:apple": 1, "minecraft:sugar": 1 } }
        pizza: { seconds: 40, ingredients: { "rustport:dough": 1, "rustport:tomato_sauce": 1, "rustport:cheese": 1 } }
        hamburger: { seconds: 40, ingredients: { "rustport:bread_loaf": 1, "rustport:patty": 1, "customcrops:cabbage": 1, "customcrops:tomato": 1, "rustport:onion": 1 } }

# 절구 (들고 다니는 도구, 설치하지 않음): 제작대·인벤토리 제작 칸에 절구 + 재료를 넣으면 결과가 나오고 절구는 남는다.
# 물병·물 양동이·우유 양동이는 빈 병·빈 양동이로 돌려준다. 재료는 "#묶음"(위 cooking.groups 또는 아래 mortar.groups)도 된다.
mortar:
  groups:
    liquid: { name: 물이나 우유, items: ["minecraft:potion", "minecraft:water_bucket", "minecraft:milk_bucket"] }
  recipes:
    dough: { amount: 1, ingredients: { "#flour": 1, "#liquid": 1 } }

# 요리 놓기: 요리를 들고 웅크린 채 블록 윗면 우클릭 → 3D 모델로 놓인다. 놓인 요리 우클릭 = 먹기, 웅크려 우클릭 = 집기
placed-food:
  enabled: true
  per-chunk-limit: 16        # 한 청크(16x16)에 놓을 수 있는 요리 수 (요리 하나 = 엔티티 2개)
  others-can-use: false      # false 면 놓은 사람만 먹기·집기 (권한 brassfield.food.admin 은 예외)
  scale: 0.8                 # 놓인 요리 크기 (1 = 블록 하나 크기)
  items: [
    "rustport:tomato_sauce", "rustport:cooked_rice", "rustport:honey_cookie", "rustport:bread_loaf", "rustport:apple_juice", "rustport:grape_juice",
    "rustport:pineapple_juice", "rustport:pitaya_juice", "rustport:cheese", "rustport:yogurt", "rustport:kimchi", "rustport:smoked_beef",
    "rustport:bacon", "rustport:smoked_salmon", "rustport:chicken_soup", "rustport:vegetable_soup", "rustport:beef_stew", "rustport:corn_soup",
    "rustport:salmon_sushi", "rustport:cabbage_wrap", "rustport:kimbap", "rustport:mushroom_fried_rice", "rustport:bacon_and_eggs", "rustport:kimchi_fried_rice",
    "rustport:meatball_pasta", "rustport:ratatouille", "rustport:fried_rice", "rustport:dumplings", "rustport:apple_pie", "rustport:pizza",
    "rustport:hamburger"
  ]

# 2단계 요리 버프: 먹으면(손으로든 놓인 요리든) 그 요리의 효과 후보 중 하나가 무작위로 붙는다 (레벨 I)
food-buffs:
  enabled: true
  effects:                   # 효과 ID (minecraft:<ID>) → 알림에 보일 이름
    speed: 신속
    haste: 성급함
    strength: 힘
    jump_boost: 점프 강화
    resistance: 저항
    fire_resistance: 화염 저항
    water_breathing: 수중 호흡
    dolphins_grace: 돌고래의 우아함
    night_vision: 야간 투시
    absorption: 흡수
    luck: 행운
    regeneration: 재생
  max-seconds:               # 너무 센 효과는 요리 지속 시간과 관계없이 이 시간까지만
    regeneration: 30
  items:                     # 요리 → 지속 시간(초, 간단 60 / 중급 120 / 복잡 180)과 효과 후보 (최대 3개, 그중 하나가 무작위)
    "rustport:salmon_sushi": { seconds: 60, effects: [water_breathing, dolphins_grace, night_vision] }
    "rustport:cabbage_wrap": { seconds: 60, effects: [resistance, absorption, regeneration] }
    "rustport:kimbap": { seconds: 60, effects: [speed, jump_boost, haste] }
    "rustport:mushroom_fried_rice": { seconds: 60, effects: [night_vision, haste, resistance] }
    "rustport:bacon_and_eggs": { seconds: 60, effects: [haste, speed, absorption] }
    "rustport:kimchi_fried_rice": { seconds: 120, effects: [fire_resistance, strength, speed] }
    "rustport:meatball_pasta": { seconds: 120, effects: [strength, resistance, absorption] }
    "rustport:ratatouille": { seconds: 120, effects: [regeneration, absorption, resistance] }
    "rustport:fried_rice": { seconds: 120, effects: [haste, speed, fire_resistance] }
    "rustport:dumplings": { seconds: 120, effects: [resistance, absorption, regeneration] }
    "rustport:apple_pie": { seconds: 120, effects: [luck, absorption, regeneration] }
    "rustport:pizza": { seconds: 180, effects: [strength, absorption, speed] }
    "rustport:hamburger": { seconds: 180, effects: [strength, resistance, haste] }

# 요리 납품 로봇 DL-7 (마을 공용): 요리를 골드로 산다. 1단계 재료(밀가루·반죽·면·소스·패티·파이 껍질)는 사지 않는다.
# 기본가 = 재료 난이도 점수 × 단계 배율 (1단계 점수×50, 2단계 점수×400×조리 시간 보너스). 노션 "요리 시스템 (구현 기준)" 참고.
# 서버 전체 판매량을 window-hours 마다 집계: 변동 = max-change × (1 − 판매 비중 ÷ 기준 비중), ±max-change 로 제한.
food-market:
  window-hours: 4
  max-change: 0.10
  prices:
    "rustport:cooked_rice": 100
    "rustport:honey_cookie": 200
    "rustport:bread_loaf": 100
    "rustport:apple_juice": 100
    "rustport:grape_juice": 300
    "rustport:pineapple_juice": 150
    "rustport:pitaya_juice": 150
    "rustport:cheese": 100
    "rustport:yogurt": 250
    "rustport:kimchi": 400
    "rustport:smoked_beef": 100
    "rustport:bacon": 100
    "rustport:smoked_salmon": 100
    "rustport:chicken_soup": 90
    "rustport:vegetable_soup": 100
    "rustport:beef_stew": 80
    "rustport:corn_soup": 80
    "rustport:bacon_and_eggs": 1200
    "rustport:salmon_sushi": 1600
    "rustport:cabbage_wrap": 1600
    "rustport:kimbap": 1600
    "rustport:mushroom_fried_rice": 1600
    "rustport:apple_pie": 2500
    "rustport:fried_rice": 3000
    "rustport:meatball_pasta": 4000
    "rustport:dumplings": 4000
    "rustport:kimchi_fried_rice": 5000
    "rustport:ratatouille": 5000
    "rustport:pizza": 4800
    "rustport:hamburger": 6000
