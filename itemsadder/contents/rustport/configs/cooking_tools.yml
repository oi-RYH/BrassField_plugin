info:
  namespace: rustport

# 개인 요리 기기 6종 (플레이어가 각자 설치·회수, 빨간 표시 없음). 기능(레시피·GUI)은 다음 단계에서 연결한다.
# 모델·텍스처: BrassField tools/machines/make_cooking_tools.py (바닥 1칸, 높이 2블록 이하, 키우지 않음: 1픽셀 = 1/16 블록)
items:
  mill:
    display_name: "제분기"
    lore:
      - "&7곡물을 가루(밀가루 등)로 가공합니다."
      - "&8개인 요리 기기 (누구나 설치·회수)"
    resource:
      material: PAPER
      generate: false
      model_path: machine/cooking/mill
    behaviours:
      furniture:
        entity: item_display
        opposite_direction: true
        display_transformation:
          translation:
            y: 0.5
        solid: true
        cancel_drop: false
        hitbox:
          length: 1
          width: 1
          height: 2
        placeable_on:
          floor: true
          walls: false
          ceiling: false

