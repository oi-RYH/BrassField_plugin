  dl7_head_surprised:
    display_name: "DL-7 머리 (surprised)"
    lore:
      - "&8BrassField 가 로봇 머리 표시에 쓰는 아이템"
    resource:
      material: PAPER
      generate: false
      model_path: machine/dl7/head_surprised

  dl7_head_thinking:
    display_name: "DL-7 머리 (thinking)"
    lore:
      - "&8BrassField 가 로봇 머리 표시에 쓰는 아이템"
    resource:
      material: PAPER
      generate: false
      model_path: machine/dl7/head_thinking

  dl7_head_heart:
    display_name: "DL-7 머리 (heart)"
    lore:
      - "&8BrassField 가 로봇 머리 표시에 쓰는 아이템"
    resource:
      material: PAPER
      generate: false
      model_path: machine/dl7/head_heart

  dl7_head_sleepy:
