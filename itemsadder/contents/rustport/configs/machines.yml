info:
  namespace: rustport

# 마을에 설치하는 거래 기계 (ItemsAdder 가구). 우클릭하면 BrassField가 해당 GUI를 연다.
# 모델·텍스처는 BrassField tools/machines/make_vending_machine.py 로 생성 (임시 모델)
items:
  stone_vending_machine:
    display_name: "증기 강화석 자판기"
    lore:
      - "&7관리자용 설치 아이템"
    resource:
      material: PAPER
      generate: false
      model_path: machine/stone_vending_machine
    behaviours:
      furniture:
        entity: item_display
        # 모델 앞면(north)이 설치한 플레이어를 보게 한다
        opposite_direction: true
        # 모델(1블록 폭 x 2블록 높이)을 1.5배로 키워 1.5블록 폭 x 3블록 높이로 보인다.
        # item_display는 모델 가운데를 기준으로 그리고 커지므로 바닥이 0.75블록 내려가 그만큼 올린다.
        display_transformation:
          translation:
            y: 0.75
          scale:
            x: 1.5
            y: 1.5
            z: 1.5
        solid: true
        cancel_drop: false
        # 1.5블록 폭이라 블록 칸에 딱 맞지 않아, 옆 칸을 막지 않게 폭 1로 둔다
        hitbox:
          length: 1
          width: 1
          height: 3
        placeable_on:
          floor: true
          walls: false
          ceiling: false

  enhancement_machine:
    display_name: "증폭 공작대"
    lore:
      - "&7관리자용 설치 아이템"
    resource:
      material: PAPER
      generate: false
      model_path: machine/enhancement_machine
    behaviours:
      furniture:
        entity: item_display
        opposite_direction: true
        display_transformation:
          translation:
            y: 0.5
        solid: true
        cancel_drop: false
        # 2블록 폭 작업대 (모델 x -8~24)
        hitbox:
          length: 1
          width: 2
          height: 2
        placeable_on:
          floor: true
          walls: false
          ceiling: false

  crop_buyer:
    display_name: "종자·작물 거래기"
    lore:
      - "&7관리자용 설치 아이템"
    resource:
      material: PAPER
      generate: false
      model_path: machine/crop_buyer
    behaviours:
      furniture:
        entity: item_display
        opposite_direction: true
        # 모델(2블록 폭 x 2블록 높이)을 1.5배로 키워 3블록 폭 x 3블록 높이로 보인다.
        # 가운데 기준으로 커지므로 바닥이 0.75블록 내려가 그만큼 올린다.
        display_transformation:
          translation:
            y: 0.75
          scale:
            x: 1.5
            y: 1.5
            z: 1.5
        solid: true
        cancel_drop: false
        # 3블록 폭 x 3블록 높이 (1.5배)
        hitbox:
          length: 1
          width: 3
          height: 3
        placeable_on:
          floor: true
          walls: false
          ceiling: false

  # 기계 위에 떠서 도는 빨간 역삼각형 표시 (BrassField가 표시 엔티티로 띄움, 설치용 아이템 아님)
  machine_marker:
    display_name: "기계 표시"
    resource:
      material: PAPER
      generate: false
      model_path: machine/machine_marker
