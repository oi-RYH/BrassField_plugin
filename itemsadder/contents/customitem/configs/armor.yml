info:
  namespace: customitem

equipments:
  torn_clothes:
    type: armor
    layer_1: armor/torn_clothes_layer_1
    layer_2: armor/torn_clothes_layer_2
  cloth_armor:
    type: armor
    layer_1: armor/cloth_armor_layer_1
    layer_2: armor/cloth_armor_layer_2
  leather_armor:
    type: armor
    layer_1: armor/leather_armor_layer_1
    layer_2: armor/leather_armor_layer_2
  knight_armor:
    type: armor
    layer_1: armor/knight_armor_layer_1
    layer_2: armor/knight_armor_layer_2
  hero_armor:
    type: armor
    layer_1: armor/hero_armor_layer_1
    layer_2: armor/hero_armor_layer_2
  master_armor:
    type: armor
    layer_1: armor/master_armor_layer_1
    layer_2: armor/master_armor_layer_2

# 투구는 3D 모델이라 재질이 종이 (철 투구면 머리에 바닐라 철 투구가 그려짐).
# 머리 칸 장착(EQUIPPABLE)과 방어 수치는 BrassField 플러그인(ArmorTrack)이 붙인다.
# 상의·하의·신발(철 방어구 재질)은 model_path 에 'customitem:' 을 붙이지 않는다 — 이 IA 베타가 한 번 더 붙여
# customitem:customitem:armor/... 가 되어 깨진다 (투구 · 무기는 붙여도 정상).
items:
  # 찢어진 옷
  torn_clothes_helmet:
    display_name: 찢어진 옷 투구
    resource:
      generate: false
      material: PAPER
      model_path: customitem:armor/torn_clothes_helmet

  torn_clothes_chestplate:
    display_name: 찢어진 옷 상의
    resource:
      generate: false
      material: IRON_CHESTPLATE
      model_path: armor/torn_clothes_chestplate
    equipment:
      id: customitem:torn_clothes
      slot_attribute_modifiers:
        armor: 1

  torn_clothes_leggings:
    display_name: 찢어진 옷 하의
    resource:
      generate: false
      material: IRON_LEGGINGS
      model_path: armor/torn_clothes_leggings
    equipment:
      id: customitem:torn_clothes
      slot_attribute_modifiers:
        armor: 1

  torn_clothes_boots:
    display_name: 찢어진 옷 신발
    resource:
      generate: false
